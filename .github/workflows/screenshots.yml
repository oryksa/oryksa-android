name: Screenshots
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build the example app
        env: { ORYKSA_TEST_TOKEN: "${{ secrets.ORYKSA_TEST_TOKEN }}" }
        run: chmod +x gradlew && ./gradlew :example:assembleDebug
      - name: Screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r example/build/outputs/apk/debug/example-debug.apk
            adb shell pm grant com.oryksa.example android.permission.RECORD_AUDIO
            for s in product chat voice; do adb shell am start -S -n com.oryksa.example/.MainActivity --es screen $s --es lang pt; sleep 15; adb exec-out screencap -p > shots/android_$s.png; done
      - uses: actions/upload-artifact@v4
        with: { name: android-screenshots, path: shots/*.png }
