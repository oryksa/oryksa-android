name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        run: chmod +x gradlew && ./gradlew :oryksa:testDebugUnitTest :oryksa:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: oryksa-aar, path: oryksa/build/outputs/aar/*.aar }
